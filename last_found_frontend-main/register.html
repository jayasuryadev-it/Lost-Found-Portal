<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create a new account on Lost & Found Portal to start reporting and recovering lost items.">
    <title>Register — Lost & Found Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="main-navbar"></nav>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <div style="text-align:center; margin-bottom:8px;">
                <img src="assets/logo.png" alt="Logo"
                    style="width:60px;height:60px;border-radius:12px;margin:0 auto 16px;">
            </div>
            <h1 class="auth-title" style="text-align:center;">Create Account</h1>
            <p class="auth-subtitle" style="text-align:center;">Join the Lost & Found community</p>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" id="reg-mobile" class="form-input" placeholder="+91 9876543210">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required
                        minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="reg-confirm" class="form-input" placeholder="Re-enter your password"
                        required>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;" id="reg-btn">
                    Create Account
                </button>
            </form>

            <p style="text-align:center; margin-top:24px; color:var(--text-secondary); font-size:0.9rem;">
                Already have an account? <a href="login.html"
                    style="color:var(--accent); text-decoration:none; font-weight:600;">Sign In</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        renderNavbar('register');

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                showToast('Passwords do not match', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const resp = await apiFetch('/register', {
                    method: 'POST',
                    body: {
                        full_name: name,
                        email: email,
                        mobile_number: mobile || null,
                        password: password,
                    }
                });

                if (resp.ok) {
                    showToast('Account created! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            } finally {
                btn.textContent = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
