<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your reported items on Lost & Found Portal.">
    <title>My Items — Lost & Found Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="main-navbar"></nav>

    <div class="page-container">
        <div
            style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:32px;">
            <div>
                <h1 style="font-size:2rem; font-weight:800;">My Items</h1>
                <p style="color:var(--text-secondary); margin-top:4px;">Manage all items you've reported</p>
            </div>
            <a href="report.html" class="btn-primary">
                + Report New Item
            </a>
        </div>

        <!-- Loading -->
        <div id="items-loading" class="spinner"></div>

        <!-- Items Grid -->
        <div id="items-grid" class="items-grid" style="display:none;"></div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display:none;">
            <div class="empty-state-icon">--</div>
            <p class="empty-state-text">You haven't reported any items yet</p>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:24px;">Start by reporting a lost or found
                item</p>
            <a href="report.html" class="btn-primary">Report an Item</a>
        </div>
    </div>

    <footer class="footer">
        <p>© 2024 Lost & Found Portal. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        if (!requireAuth()) { /* redirected */ }
        renderNavbar('my-items');

        async function loadMyItems() {
            const loading = document.getElementById('items-loading');
            const grid = document.getElementById('items-grid');
            const empty = document.getElementById('empty-state');

            try {
                const resp = await apiFetch('/my-items');
                if (resp && resp.ok) {
                    const items = await resp.json();
                    loading.style.display = 'none';

                    if (items.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }

                    grid.style.display = 'grid';
                    grid.innerHTML = items.map(item => {
                        const imageHTML = item.image_url
                            ? `<div class="item-card-image"><img src="${item.image_url}" alt="${item.title}" loading="lazy"></div>`
                            : `<div class="item-card-placeholder">No Image</div>`;

                        return `
                            <div class="item-card">
                                <div onclick="window.location.href='item.html?id=${item.id}'" style="cursor:pointer;">
                                    ${imageHTML}
                                    <div class="item-card-body" style="padding-bottom:8px;">
                                        <div style="display:flex; gap:8px; margin-bottom:10px;">
                                            ${categoryBadge(item.category)}
                                        </div>
                                        <h3 class="item-card-title">${item.title}</h3>
                                        <p class="item-card-desc">${item.description || 'No description provided'}</p>
                                        <div class="item-card-meta">
                                            <span>${item.location || 'Unknown'}</span>
                                            <span>${formatDate(item.created_at)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div style="padding:0 20px 16px; display:flex; align-items:center; gap:10px;">
                                    <label style="color:var(--text-muted); font-size:0.8rem; font-weight:500; white-space:nowrap;">Status:</label>
                                    <select class="form-input" style="padding:8px 12px; font-size:0.8rem; flex:1;"
                                        onchange="updateStatus(${item.id}, this.value, this)" onclick="event.stopPropagation();">
                                        <option value="OPEN" ${item.status === 'OPEN' ? 'selected' : ''}>Open</option>
                                        <option value="CLAIMED" ${item.status === 'CLAIMED' ? 'selected' : ''}>Claimed</option>
                                        <option value="CLOSED" ${item.status === 'CLOSED' ? 'selected' : ''}>Closed</option>
                                    </select>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    showToast('Failed to load items', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
                loading.style.display = 'none';
            }
        }

        async function updateStatus(itemId, newStatus, selectEl) {
            try {
                const resp = await apiFetch(`/items/${itemId}`, {
                    method: 'PUT',
                    body: { status: newStatus }
                });
                if (resp && resp.ok) {
                    showToast(`Status updated to ${newStatus}`, 'success');
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Failed to update status', 'error');
                    loadMyItems(); // reload to revert
                }
            } catch (e) {
                showToast('Network error', 'error');
                loadMyItems();
            }
        }

        loadMyItems();
    </script>
</body>

</html>
