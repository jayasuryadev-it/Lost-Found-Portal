<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Lost & Found Portal account to manage and recover your items.">
    <title>Login — Lost & Found Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="main-navbar"></nav>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <div style="text-align:center; margin-bottom:8px;">
                <img src="assets/logo.png" alt="Logo"
                    style="width:60px;height:60px;border-radius:12px;margin:0 auto 16px;">
            </div>
            <h1 class="auth-title" style="text-align:center;">Welcome Back</h1>
            <p class="auth-subtitle" style="text-align:center;">Sign in to your account</p>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;" id="login-btn">
                    Sign In
                </button>
            </form>

            <p style="text-align:center; margin-top:24px; color:var(--text-secondary); font-size:0.9rem;">
                Don't have an account? <a href="register.html"
                    style="color:var(--accent); text-decoration:none; font-weight:600;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        renderNavbar('login');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const resp = await apiFetch('/login', {
                    method: 'POST',
                    body: { email, password }
                });

                if (resp.ok) {
                    const data = await resp.json();
                    setToken(data.access_token);

                    // Fetch user profile
                    const user = await fetchCurrentUser();

                    showToast('Login successful! Redirecting...', 'success');
                    const redirect = user && user.role === 'admin' ? 'admin.html' : 'dashboard.html';
                    setTimeout(() => window.location.href = redirect, 1000);
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Invalid credentials', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            } finally {
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
