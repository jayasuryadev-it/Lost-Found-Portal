<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View item details on Lost & Found Portal.">
    <title>Item Details -- Lost & Found Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="main-navbar"></nav>

    <div class="page-container" style="max-width:800px;">
        <!-- Loading -->
        <div id="item-loading" class="spinner"></div>

        <!-- Item Detail Content -->
        <div id="item-detail" style="display:none;"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        renderNavbar('');

        let currentItem = null;

        // -- Get item ID from URL --
        const params = new URLSearchParams(window.location.search);
        const itemId = params.get('id');

        if (!itemId) {
            showToast('No item specified', 'error');
            setTimeout(() => window.location.href = 'dashboard.html', 1500);
        }

        // -- Load item detail --
        async function loadItem() {
            try {
                const resp = await apiFetch(`/items/${itemId}`);
                if (resp && resp.ok) {
                    currentItem = await resp.json();
                    renderItem();
                } else {
                    showToast('Item not found', 'error');
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                }
            } catch (err) {
                showToast('Network error', 'error');
            }
        }

        // -- Render item --
        function renderItem() {
            document.getElementById('item-loading').style.display = 'none';
            const detail = document.getElementById('item-detail');
            detail.style.display = 'block';

            const user = getUser();
            const isOwner = user && user.id === currentItem.user_id;

            const imageHTML = currentItem.image_url
                ? `<img src="${currentItem.image_url}" alt="${currentItem.title}" class="detail-image">`
                : `<div style="width:100%;height:300px;background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(245,166,35,0.02));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--text-muted);margin-bottom:24px;">No Image Available</div>`;

            detail.innerHTML = `
                <a href="dashboard.html" style="color:var(--text-secondary);text-decoration:none;font-size:0.9rem;display:inline-flex;align-items:center;gap:6px;margin-bottom:24px;">
                    &larr; Back to Browse
                </a>

                ${imageHTML}

                <div class="glass-card" style="padding:32px;">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                        ${categoryBadge(currentItem.category)}
                        ${statusBadge(currentItem.status)}
                        ${isOwner ? '<span class="badge" style="background:rgba(245,166,35,0.15);color:#F5A623;border:1px solid rgba(245,166,35,0.3);">YOUR ITEM</span>' : ''}
                    </div>

                    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:20px;">${currentItem.title}</h1>

                    ${currentItem.description ? `
                        <p style="color:var(--text-secondary); line-height:1.7; margin-bottom:24px; font-size:1rem;">
                            ${currentItem.description}
                        </p>
                    ` : ''}

                    <div style="border-top:1px solid var(--border-color); padding-top:20px;">
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">Location</span>
                            <span class="detail-meta-value">${currentItem.location || 'Not specified'}</span>
                        </div>
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">Date Reported</span>
                            <span class="detail-meta-value">${currentItem.date_reported || formatDate(currentItem.created_at)}</span>
                        </div>
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">Reported By</span>
                            <span class="detail-meta-value">${currentItem.owner_name || 'Anonymous'}</span>
                        </div>
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">Contact</span>
                            <span class="detail-meta-value">${currentItem.owner_email || 'N/A'}</span>
                        </div>
                        ${currentItem.owner_mobile ? `
                            <div class="detail-meta-row">
                                <span class="detail-meta-label">Mobile</span>
                                <span class="detail-meta-value">${currentItem.owner_mobile}</span>
                            </div>
                        ` : ''}
                        <div class="detail-meta-row" style="border-bottom:none;">
                            <span class="detail-meta-label">Status</span>
                            <span class="detail-meta-value">${statusBadge(currentItem.status)}</span>
                        </div>
                    </div>

                    ${currentItem.category === 'LOST' && currentItem.status === 'OPEN' ? `
                        <div style="margin-top:28px; padding:20px; background:rgba(59,130,246,0.1); border-radius:12px; text-align:center; border:1px solid rgba(59,130,246,0.2);">
                            <p style="font-weight:600; color:#3B82F6;">Waiting for auto-match</p>
                            <p style="font-size:0.85rem; color:var(--text-secondary); margin-top:4px;">When someone posts a matching FOUND item, the owner will be notified automatically via email.</p>
                        </div>
                    ` : ''}

                    ${currentItem.status === 'CLAIMED' ? `
                        <div style="margin-top:28px; padding:20px; background:rgba(245,166,35,0.1); border-radius:12px; text-align:center; border:1px solid rgba(245,166,35,0.2);">
                            <p style="font-weight:600; color:var(--accent);">This item has been claimed!</p>
                            <p style="font-size:0.85rem; color:var(--text-secondary); margin-top:4px;">Someone has reported finding this item.</p>
                        </div>
                    ` : ''}

                    ${isOwner ? `
                        <div style="margin-top:28px; padding-top:24px; border-top:1px solid var(--border-color); display:flex; gap:12px;">
                            <button class="btn-danger btn-sm" onclick="deleteItem()">Delete Item</button>
                        </div>
                    ` : ''}
                </div>
            `;

            document.title = `${currentItem.title} -- Lost & Found Portal`;
        }

        // -- Delete item --
        async function deleteItem() {
            if (!confirm('Are you sure you want to delete this item?')) return;
            try {
                const resp = await apiFetch(`/items/${itemId}`, { method: 'DELETE' });
                if (resp && (resp.ok || resp.status === 204)) {
                    showToast('Item deleted', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showToast('Failed to delete item', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            }
        }

        // -- Init --
        loadItem();
    </script>
</body>

</html>
