<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Lost & Found Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/logo.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" id="main-navbar"></nav>

    <div class="page-container">
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 8px;">Admin Dashboard</h1>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">Manage users, moderate items, and view statistics.</p>

        <!-- Stats Cards -->
        <div class="admin-stats-grid" id="stats-grid">
            <div class="glass-card stat-card"><div class="spinner" style="margin:8px auto;width:20px;height:20px;"></div></div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs">
            <button class="filter-tab active" onclick="switchTab('users')" id="tab-users">Users</button>
            <button class="filter-tab" onclick="switchTab('items')" id="tab-items">Items</button>
        </div>

        <!-- Users Section -->
        <div id="section-users">
            <div class="admin-search">
                <input type="text" class="form-input" id="user-search" placeholder="Search users by name or email..." oninput="debounceUserSearch()">
            </div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="7" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Items Section -->
        <div id="section-items" style="display: none;">
            <div style="display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
                <input type="text" class="form-input" id="item-search" placeholder="Search items..." style="max-width: 300px;" oninput="debounceItemSearch()">
                <select class="form-input" id="item-category-filter" style="max-width: 160px;" onchange="loadAdminItems()">
                    <option value="">All Categories</option>
                    <option value="LOST">Lost</option>
                    <option value="FOUND">Found</option>
                </select>
                <select class="form-input" id="item-status-filter" style="max-width: 160px;" onchange="loadAdminItems()">
                    <option value="">All Status</option>
                    <option value="OPEN">Open</option>
                    <option value="CLAIMED">Claimed</option>
                    <option value="CLOSED">Closed</option>
                </select>
            </div>
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Owner</th>
                            <th>Location</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="items-tbody">
                        <tr><td colspan="8" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card" style="max-width:400px;">
            <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:12px;" id="confirm-title">Confirm</h3>
            <p style="color:var(--text-secondary); margin-bottom:24px;" id="confirm-message"></p>
            <div style="display:flex; gap:12px; justify-content:flex-end;">
                <button class="btn-secondary btn-sm" onclick="closeConfirm()">Cancel</button>
                <button class="btn-danger btn-sm" id="confirm-btn" onclick="confirmAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // ──── Auth Guard ────
        if (!requireAdmin()) throw new Error('Not admin');
        renderNavbar('admin');

        let pendingAction = null;
        let userSearchTimer = null;
        let itemSearchTimer = null;

        // ──── Tab Switching ────
        function switchTab(tab) {
            document.getElementById('section-users').style.display = tab === 'users' ? '' : 'none';
            document.getElementById('section-items').style.display = tab === 'items' ? '' : 'none';
            document.getElementById('tab-users').classList.toggle('active', tab === 'users');
            document.getElementById('tab-items').classList.toggle('active', tab === 'items');
            if (tab === 'items') loadAdminItems();
        }

        // ──── Stats ────
        async function loadStats() {
            try {
                const resp = await apiFetch('/admin/stats');
                if (!resp || !resp.ok) return;
                const s = await resp.json();
                document.getElementById('stats-grid').innerHTML = `
                    <div class="glass-card stat-card"><div class="stat-value">${s.total_users}</div><div class="stat-label">Total Users</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.total_items}</div><div class="stat-label">Total Items</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.lost_items}</div><div class="stat-label">Lost Items</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.found_items}</div><div class="stat-label">Found Items</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.open_items}</div><div class="stat-label">Open</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.claimed_items}</div><div class="stat-label">Claimed</div></div>
                    <div class="glass-card stat-card"><div class="stat-value">${s.closed_items}</div><div class="stat-label">Closed</div></div>
                `;
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        // ──── Users ────
        async function loadUsers(search = '') {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>';
            try {
                const params = search ? `?search=${encodeURIComponent(search)}` : '';
                const resp = await apiFetch(`/admin/users${params}`);
                if (!resp || !resp.ok) return;
                const users = await resp.json();
                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state" style="padding:40px;">No users found</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td style="color:var(--text-muted);">#${u.id}</td>
                        <td style="font-weight:600;">${escapeHtml(u.full_name)}</td>
                        <td style="color:var(--text-secondary);">${escapeHtml(u.email)}</td>
                        <td style="color:var(--text-secondary);">${u.mobile_number || '—'}</td>
                        <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
                        <td style="color:var(--text-muted);">${formatDate(u.created_at)}</td>
                        <td>
                            <div class="admin-actions">
                                ${u.role === 'admin'
                                    ? `<button class="btn-secondary btn-xs" onclick="toggleRole(${u.id}, 'user')">Demote</button>`
                                    : `<button class="btn-primary btn-xs" onclick="toggleRole(${u.id}, 'admin')">Make Admin</button>`
                                }
                                <button class="btn-danger btn-xs" onclick="confirmDelete('user', ${u.id}, '${escapeHtml(u.full_name)}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load users:', e);
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--danger);">Failed to load users</td></tr>';
            }
        }

        function debounceUserSearch() {
            clearTimeout(userSearchTimer);
            userSearchTimer = setTimeout(() => {
                loadUsers(document.getElementById('user-search').value.trim());
            }, 300);
        }

        async function toggleRole(userId, newRole) {
            try {
                const resp = await apiFetch(`/admin/users/${userId}`, {
                    method: 'PUT',
                    body: { role: newRole }
                });
                if (resp && resp.ok) {
                    showToast(`User role updated to ${newRole}`, 'success');
                    loadUsers(document.getElementById('user-search').value.trim());
                    loadStats();
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Failed to update role', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ──── Items ────
        async function loadAdminItems() {
            const tbody = document.getElementById('items-tbody');
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>';
            try {
                const search = document.getElementById('item-search').value.trim();
                const category = document.getElementById('item-category-filter').value;
                const statusFilter = document.getElementById('item-status-filter').value;
                const params = new URLSearchParams();
                if (search) params.set('search', search);
                if (category) params.set('category', category);
                if (statusFilter) params.set('status_filter', statusFilter);
                const qs = params.toString() ? `?${params.toString()}` : '';
                const resp = await apiFetch(`/admin/items${qs}`);
                if (!resp || !resp.ok) return;
                const items = await resp.json();
                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty-state" style="padding:40px;">No items found</td></tr>';
                    return;
                }
                tbody.innerHTML = items.map(item => `
                    <tr>
                        <td style="color:var(--text-muted);">#${item.id}</td>
                        <td style="font-weight:600;">
                            <a href="item.html?id=${item.id}" style="color:var(--text-primary); text-decoration:none;">${escapeHtml(item.title)}</a>
                        </td>
                        <td>${categoryBadge(item.category)}</td>
                        <td>
                            <select class="form-input btn-xs" style="padding:4px 8px; font-size:0.75rem; width:auto; min-width:90px;" onchange="updateItemStatus(${item.id}, this.value)">
                                <option value="OPEN" ${item.status === 'OPEN' ? 'selected' : ''}>Open</option>
                                <option value="CLAIMED" ${item.status === 'CLAIMED' ? 'selected' : ''}>Claimed</option>
                                <option value="CLOSED" ${item.status === 'CLOSED' ? 'selected' : ''}>Closed</option>
                            </select>
                        </td>
                        <td style="color:var(--text-secondary);">${escapeHtml(item.owner_name || '—')}</td>
                        <td style="color:var(--text-secondary);">${escapeHtml(item.location || '—')}</td>
                        <td style="color:var(--text-muted);">${formatDate(item.created_at)}</td>
                        <td>
                            <button class="btn-danger btn-xs" onclick="confirmDelete('item', ${item.id}, '${escapeHtml(item.title)}')">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load items:', e);
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px; color:var(--danger);">Failed to load items</td></tr>';
            }
        }

        function debounceItemSearch() {
            clearTimeout(itemSearchTimer);
            itemSearchTimer = setTimeout(() => loadAdminItems(), 300);
        }

        async function updateItemStatus(itemId, newStatus) {
            try {
                const resp = await apiFetch(`/admin/items/${itemId}`, {
                    method: 'PUT',
                    body: { status: newStatus }
                });
                if (resp && resp.ok) {
                    showToast(`Item status updated to ${newStatus}`, 'success');
                    loadStats();
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Failed to update status', 'error');
                    loadAdminItems();
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ──── Confirm Modal ────
        function confirmDelete(type, id, name) {
            document.getElementById('confirm-title').textContent = `Delete ${type === 'user' ? 'User' : 'Item'}`;
            document.getElementById('confirm-message').textContent = `Are you sure you want to delete "${name}"? This action cannot be undone.`;
            document.getElementById('confirm-modal').style.display = '';
            pendingAction = { type, id };
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').style.display = 'none';
            pendingAction = null;
        }

        async function confirmAction() {
            if (!pendingAction) return;
            const { type, id } = pendingAction;
            closeConfirm();
            try {
                const endpoint = type === 'user' ? `/admin/users/${id}` : `/admin/items/${id}`;
                const resp = await apiFetch(endpoint, { method: 'DELETE' });
                if (resp && (resp.ok || resp.status === 204)) {
                    showToast(`${type === 'user' ? 'User' : 'Item'} deleted successfully`, 'success');
                    if (type === 'user') loadUsers(document.getElementById('user-search').value.trim());
                    else loadAdminItems();
                    loadStats();
                } else {
                    const data = await resp.json();
                    showToast(data.detail || 'Delete failed', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ──── Escape HTML ────
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ──── Init ────
        loadStats();
        loadUsers();
    </script>
</body>

</html>
